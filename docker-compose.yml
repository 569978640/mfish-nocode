services:
  mf-gateway:
    build: mf-start/mf-start-gateway
    container_name: mf-gateway
    network_mode: host
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /plm/windflow/logs:/app/logs

  mf-oauth:
    build: mf-start/mf-start-oauth
    container_name: mf-oauth
    network_mode: host
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /plm/windflow/logs:/app/logs

  mf-sys:
    build: mf-start/mf-start-sys
    container_name: mf-sys
    network_mode: host
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /plm/windflow/logs:/app/logs
      - /plm/windflow/code:/app/code

  mf-bfces:
    build: mf-start/mf-start-bfces
    container_name: mf-bfces
    network_mode: host
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /plm/windflow/logs:/app/logs