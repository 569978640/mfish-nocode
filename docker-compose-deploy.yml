# 仅部署 gateway / oauth / sys / bfces 四个微服务的编排文件
#
# 离线部署链路：
#   联网机：docker compose --env-file .env -f docker-compose-deploy.yml build
#           docker save 导出镜像 -> mfish-images.tar
#   离线机：docker load -i mfish-images.tar
#           docker compose --env-file .env -f docker-compose-deploy.yml up -d
#
# 关键设计：
#   1. pull_policy: never —— 离线机只使用本地已 load 的镜像，绝不尝试联网拉取
#   2. network_mode: host —— 仅 Linux；服务直接注册/监听宿主机 IP，
#      网关通过 lb:// 互调通畅，无需映射端口（宿主端口 8888/9218/9221/9241）
#   3. 挂载卷 :Z —— RHEL SELinux enforcing 下自动打容器标签，保证日志可写
#   4. command 覆盖 jar 内打包的 Nacos 地址，切换环境只需改 .env，无需重新打包

services:
  # 网关：宿主端口 8888
  gateway:
    image: mfish/mf-gateway:${MF_IMAGE_TAG:-2.4.1}
    pull_policy: never
    build: mf-start/mf-start-gateway
    container_name: mf-gateway
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=${NACOS_PROFILE:-dev}
      - JAVA_TOOL_OPTIONS=${JVM_OPTS:--Xms512m -Xmx1024m}
    command:
      - --spring.cloud.nacos.server-addr=${NACOS_ADDR}
      - --spring.cloud.nacos.username=${NACOS_USER}
      - --spring.cloud.nacos.password=${NACOS_PASS}
      - --spring.cloud.sentinel.datasource.ds1.nacos.server-addr=${NACOS_ADDR}
    volumes:
      - ./logs/gateway:/app/logs:Z

  # 认证中心：宿主端口 9218
  oauth:
    image: mfish/mf-oauth:${MF_IMAGE_TAG:-2.4.1}
    pull_policy: never
    build: mf-start/mf-start-oauth
    container_name: mf-oauth
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=${NACOS_PROFILE:-dev}
      - JAVA_TOOL_OPTIONS=${JVM_OPTS:--Xms512m -Xmx1024m}
    command:
      - --spring.cloud.nacos.server-addr=${NACOS_ADDR}
      - --spring.cloud.nacos.username=${NACOS_USER}
      - --spring.cloud.nacos.password=${NACOS_PASS}
    volumes:
      - ./logs/oauth:/app/logs:Z

  # 系统中心：宿主端口 9221
  sys:
    image: mfish/mf-sys:${MF_IMAGE_TAG:-2.4.1}
    pull_policy: never
    build: mf-start/mf-start-sys
    container_name: mf-sys
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=${NACOS_PROFILE:-dev}
      - JAVA_TOOL_OPTIONS=${JVM_OPTS:--Xms512m -Xmx1024m}
    command:
      - --spring.cloud.nacos.server-addr=${NACOS_ADDR}
      - --spring.cloud.nacos.username=${NACOS_USER}
      - --spring.cloud.nacos.password=${NACOS_PASS}
    volumes:
      - ./logs/sys:/app/logs:Z
      - ./volumes/sys/code:/app/code:Z

  # BFCES 业务服务：宿主端口 9241，依赖两个内网 Oracle
  bfces:
    image: mfish/mf-bfces:${MF_IMAGE_TAG:-2.4.1}
    pull_policy: never
    build: mf-start/mf-start-bfces
    container_name: mf-bfces
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=${NACOS_PROFILE:-dev}
      - JAVA_TOOL_OPTIONS=${JVM_OPTS:--Xms512m -Xmx1024m}
    command:
      - --spring.cloud.nacos.server-addr=${NACOS_ADDR}
      - --spring.cloud.nacos.username=${NACOS_USER}
      - --spring.cloud.nacos.password=${NACOS_PASS}
    volumes:
      - ./logs/bfces:/app/logs:Z
