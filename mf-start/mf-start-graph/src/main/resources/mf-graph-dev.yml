mybatis-plus:
  mapper-locations: classpath*:cn/com/mfish/graph/**/*Mapper.xml
  global-config:
    banner: false
    db-config:
      table-underline: true
      logic-not-delete-value: 0
      logic-delete-value: 1

spring:
  datasource:
    dynamic:
      primary: master
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://192.168.111.103:5432/mf_plm
          username: postgres
          password: postgres
rocketmq:
  name-server: 192.168.111.103:9876
  producer:
    topic: plm-graph-sync
    group: plm-graph-sync-group
  consumer:
    group: plm-graph-sync-group
    topic: plm-graph-sync
    enableDLQ: true
    maxRetryTimes: 3

nebula:
  single:
    enabled: true
    addresses: 192.168.111.103:9669
  cluster:
    enabled: false
    addresses: []
  username: root
  password: nebula
  pool:
    # min-conns: 10
    # max-conns: 100
    min-conns: 5
    max-conns: 20
    timeout: 3000
    idle-timeout: 60
  space:
    name: plm_graph
    charset: utf8
    replica-factor: 1
    partition-num: 100

debezium:
  enabled: true
  offset:
    storage:
      path: ./debezium-offsets
  connector:
    host: 192.168.111.103
    port: 5432
    database: mf_plm
    username: replication_user
    password: postgres
    slot: mf_plm_slot
    publication: mf_plm_publication
    tables:
      - public.part
      - public.document
      - public.document_master
      - public.folder
      - public.part_master
      - public.product
      - public.contains_link
      - public.iteraite_link
    table-exclude:
      - sync_failed_records
    redis-address: 192.168.111.103:6379
    redis-password: redis
    redis-database: 0
