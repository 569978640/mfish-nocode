swagger:
  title: 'WindFlow工作流服务'
  prefix: /workflow
mybatis-plus:
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:cn/com/mfish/workflow/mapper/**/*Mapper.xml
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      #主键类型  0:"数据库ID自增",1:"该类型为未设置主键类型", 2:"用户输入ID",3:"全局唯一ID (数字类型唯一ID)", 4:"全局唯一ID UUID",5:"字符串全局唯一ID (idWorker 的字符串表示)";
      #id-type: 0
      # 默认数据库表下划线命名
      table-underline: true
      #逻辑删除 删除前
      logic-not-delete-value: 0
      #逻辑删除 删除后
      logic-delete-value: 1
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回类型为Map,显示null对应的字段
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    jdbc-type-for-null:
spring:
  datasource:
    dynamic:
      hikari:
        # ========== 连接池核心参数 ==========
        minimum-idle: 5              # 连接池最小空闲连接数
        maximum-pool-size: 20        # 连接池最大连接数
        idle-timeout: 300000         # 5分钟，空闲连接存活最大时间
        max-lifetime: 1800000        # 30分钟 连接最大存活时间
        connection-timeout: 30000    # 连接超时时间
        validation-timeout: 5000
        # ========== 连接检测 ==========
        connection-test-query: SELECT 1
        # ========== PreparedStatement 缓存 ==========
        data-source-properties:
          cachePrepStmts: true
          prepStmtCacheSize: 250
          prepStmtCacheSqlLimit: 2048
          useServerPrepStmts: true
      datasource:
        # 主库数据源
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://192.168.111.103:3306/mf_workflow?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true
          username: root
          password: "!QAZ2wsx"
            # 从库数据源
            # slave:
            # username:
            # password:
            # url:
          # driver-class-name:
      # seata: true    # 开启seata代理，开启后默认每个数据源都代理，如果某个不需要代理可单独关闭
# Flowable 会自动建表
flowable:
  # 自动更新数据库结构
  database-schema-update: true
  # 启用异步执行器
  async-executor-activate: true
  eventregistry:
    enabled: false
  # 检查流程定义
#  check-process-definitions: false